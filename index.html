<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendrier de l’Avent numérique</title>
<style>
:root{
  --nuit:#0b1f1c; --sapin:#12332d; --sapin2:#1a4a41; --rouge:#b3261e; --rouge2:#d8453a;
  --or:#e9bf5b; --creme:#fbf3df; --encre:#2a2118; --gris:#b9c7c2;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;color:var(--creme);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(ellipse at 50% -10%,#1e5a4d 0%,transparent 60%),
    linear-gradient(180deg,var(--nuit),#071412 100%);
  background-attachment:fixed;
  padding:2.5rem 1rem 3rem;
}
.serif{font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}

/* neige */
#neige{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#neige i{position:absolute;top:-10px;background:#fff;border-radius:50%;opacity:.7;animation:chute linear infinite}
@keyframes chute{to{transform:translate3d(var(--dx),105vh,0)}}

header,main,footer{position:relative;z-index:1}
header{text-align:center;max-width:720px;margin:0 auto 2rem}
header h1{
  font-size:clamp(2rem,6vw,3.4rem);line-height:1.1;color:var(--or);
  text-shadow:0 2px 20px rgba(233,191,91,.25);margin-bottom:.8rem;
}
header p{color:var(--gris);line-height:1.6;font-size:1.02rem}
#statut{
  display:inline-block;margin-top:1.2rem;padding:.5rem 1.1rem;border-radius:99px;
  background:rgba(251,243,223,.08);border:1px solid rgba(233,191,91,.4);color:var(--creme);font-size:.95rem;
}

#outils-test{margin-top:1rem;display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
#outils-test button{
  font:inherit;font-size:.9rem;cursor:pointer;padding:.45rem 1rem;border-radius:8px;
  background:transparent;color:var(--or);border:1px dashed var(--or);
}
#outils-test button:hover,#btn-test[aria-pressed="true"]{background:var(--or);color:var(--nuit)}
#outils-test button:focus-visible{outline:3px solid var(--creme);outline-offset:3px}

.grille{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:1rem;max-width:1000px;margin:0 auto;
}

/* case */
.case{
  position:relative;aspect-ratio:1/1.05;border-radius:14px;cursor:pointer;
  border:2px solid var(--or);color:var(--or);
  background:
    linear-gradient(135deg,rgba(255,255,255,.07),transparent 50%),
    var(--rouge);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;
  box-shadow:0 6px 16px rgba(0,0,0,.4);
  transition:transform .2s ease,box-shadow .2s ease;
  font:inherit;overflow:hidden;
}
.case:nth-child(3n+2){background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 50%),var(--sapin2)}
.case:nth-child(3n){background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 50%),#7d1b17}
.case::before{ /* ruban */
  content:"";position:absolute;left:0;right:0;top:50%;height:10px;transform:translateY(-50%);
  background:rgba(233,191,91,.22);
}
.case::after{
  content:"";position:absolute;top:0;bottom:0;left:50%;width:10px;transform:translateX(-50%);
  background:rgba(233,191,91,.22);
}
.case .num{
  position:relative;z-index:1;font-size:2.6rem;font-weight:700;line-height:1;
  background:inherit;padding:.15rem .6rem;border-radius:10px;
}
.case .mini{position:relative;z-index:1;font-size:.78rem;color:var(--creme);opacity:.85}
.case:hover:not([aria-disabled="true"]){transform:translateY(-4px) rotate(-1deg);box-shadow:0 12px 24px rgba(0,0,0,.5)}
.case:focus-visible,.fermer:focus-visible{outline:3px solid var(--creme);outline-offset:3px}

.case.ouverte{background:var(--creme);border-color:var(--or);color:var(--rouge)}
.case.ouverte::before,.case.ouverte::after{display:none}
.case.ouverte .mini{color:var(--encre)}
.case.ouverte .num{background:none}

.case[aria-disabled="true"]{
  cursor:not-allowed;background:#10241f;border-color:#2c4a43;color:#4f6b64;box-shadow:none;
}
.case[aria-disabled="true"]::before,.case[aria-disabled="true"]::after{background:rgba(255,255,255,.05)}
.case[aria-disabled="true"] .mini{color:#6d8a83}
.case.secoue{animation:secoue .4s}
@keyframes secoue{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* fenêtre de lecture */
dialog{
  margin:auto;border:none;background:none;color:var(--encre);
  width:min(640px,calc(100vw - 1.5rem));max-height:calc(100vh - 1.5rem);overflow:visible;
}
dialog::backdrop{background:rgba(3,12,10,.8);backdrop-filter:blur(3px)}
dialog[open]{animation:ouvre .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes ouvre{from{opacity:0;transform:scale(.8) rotate(-2deg)}to{opacity:1;transform:none}}
.carte{
  position:relative;background:var(--creme);border-radius:18px;
  border:4px solid var(--or);outline:2px solid var(--rouge);outline-offset:-10px;
  padding:2.4rem 2rem 2rem;max-height:calc(100vh - 1.5rem);overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.carte .jour{font-size:1rem;color:var(--rouge);font-weight:600;margin-bottom:.3rem}
.carte .pastille{
  display:inline-block;font-size:.9rem;font-weight:600;padding:.25rem .8rem;border-radius:99px;
  color:#fff;margin-bottom:1rem;
}
.pastille.attaque{background:var(--sapin2)} .pastille.harcelement{background:var(--rouge)} .pastille.synthese{background:#8a6a14}
.carte h2{font-size:clamp(1.5rem,5vw,2rem);line-height:1.2;margin-bottom:1rem;color:var(--encre)}
.carte .texte{font-size:1.12rem;line-height:1.7;max-width:60ch}
.carte .retenir{
  margin-top:1.4rem;padding:1rem 1.2rem;border-left:5px solid var(--or);
  background:rgba(179,38,30,.08);border-radius:0 10px 10px 0;font-size:1.05rem;line-height:1.55;
}
.carte .retenir b{color:var(--rouge)}
.fermer{
  position:absolute;top:.7rem;right:.8rem;width:2.6rem;height:2.6rem;border-radius:50%;
  border:2px solid var(--rouge);background:var(--creme);color:var(--rouge);font-size:1.5rem;cursor:pointer;line-height:1;
}
.fermer:hover{background:var(--rouge);color:var(--creme)}

#toast{
  position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,200%);z-index:5;
  background:var(--creme);color:var(--encre);padding:.7rem 1.2rem;border-radius:12px;
  border:2px solid var(--or);transition:transform .3s;max-width:90vw;text-align:center;
}
#toast.visible{transform:translate(-50%,0)}

footer{margin-top:2.5rem;text-align:center;color:var(--gris);font-size:.88rem;line-height:1.6}
footer a{color:var(--or)}

@media (prefers-reduced-motion:reduce){
  #neige{display:none}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="neige" aria-hidden="true"></div>

<header>
  <h1 class="serif">Calendrier de l’Avent numérique</h1>
  <p>24 jours, 24 conseils pour te protéger des cyberattaques et du cyberharcèlement. Une case par jour, du 1<sup>er</sup> au 24 décembre.</p>
  <span id="statut" role="status"></span>
  <!-- OUTILS DE TEST : supprime ce bloc <div> avant de rendre le projet -->
  <div id="outils-test">
    <button type="button" id="btn-test" aria-pressed="false">Activer le mode test</button>
    <button type="button" id="btn-reset">Remettre les cases à zéro</button>
  </div>
</header>

<main>
  <div class="grille" id="grille"></div>
</main>

<footer>
  <p>Besoin d’aide ? <b>3018</b> : cyberharcèlement (gratuit, anonyme). <b>17Cyber</b> et <a href="https://www.cybermalveillance.gouv.fr" target="_blank" rel="noopener">cybermalveillance.gouv.fr</a> : piratage et arnaques.</p>
</footer>

<dialog id="fenetre" aria-labelledby="f-titre">
  <div class="carte">
    <button class="fermer" id="fermer" aria-label="Fermer">×</button>
    <p class="jour serif" id="f-jour"></p>
    <span class="pastille" id="f-cat"></span>
    <h2 class="serif" id="f-titre"></h2>
    <p class="texte" id="f-texte"></p>
    <p class="retenir" id="f-retenir"></p>
  </div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const CATS = {
  attaque:{label:"Cyberattaque"},
  harcelement:{label:"Cyberharcèlement"},
  synthese:{label:"Pour finir"}
};

const DATA = [
 {c:"attaque",t:"Un mot de passe long et unique",x:"Une phrase de passe de 12 caractères ou plus est bien plus solide qu’un mot court avec un chiffre. Si tu réutilises le même mot de passe, un seul site piraté suffit à ouvrir tous tes comptes.",r:"Un mot de passe différent par compte, rangé dans un gestionnaire de mots de passe."},
 {c:"harcelement",t:"Reconnaître le cyberharcèlement",x:"Moqueries répétées, rumeurs, photos humiliantes, messages d’insultes, faux profils : quand les attaques se répètent en ligne, c’est du cyberharcèlement. Ce n’est jamais de ta faute, et tu n’as pas à l’endurer seul.",r:"Parles-en vite à un adulte ou à un ami de confiance."},
 {c:"attaque",t:"Repérer un mail de phishing",x:"Les escrocs imitent ta banque, les impôts ou un livreur. Signes qui alertent : urgence, menace, faute, adresse d’expéditeur bizarre. Passe la souris sur le lien (sans cliquer) pour voir où il mène vraiment.",r:"Dans le doute, ne clique pas : va sur le site officiel en tapant l’adresse toi-même."},
 {c:"harcelement",t:"Ne réponds pas aux agresseurs",x:"Répondre à chaud, c’est donner à l’agresseur ce qu’il cherche et risquer d’aggraver la situation. Respire, ne réponds pas et passe aux étapes suivantes : preuves, blocage, signalement.",r:"Ne réponds pas, ne te venge pas : protège-toi d’abord."},
 {c:"attaque",t:"La double authentification (2FA)",x:"Avec la 2FA, un mot de passe volé ne suffit plus : il faut aussi un code ou une validation sur ton téléphone. Active-la en priorité sur ta messagerie, tes réseaux sociaux et ta banque.",r:"Préfère une application d’authentification aux codes par SMS quand c’est possible."},
 {c:"harcelement",t:"Garde les preuves",x:"Fais des captures d’écran de chaque message, commentaire ou publication. Note aussi le pseudo, l’adresse (URL), la date et l’heure. Ne supprime rien, même si c’est pénible à relire.",r:"Sans preuves, il est beaucoup plus difficile de faire retirer les contenus ou de porter plainte."},
 {c:"attaque",t:"Les faux SMS (smishing)",x:"« Votre colis est bloqué », « amende à payer », « Compte Ameli à mettre à jour » : ces SMS mènent à de faux sites qui volent tes données bancaires. Les vraies administrations ne demandent pas de payer par un lien envoyé par SMS.",r:"Ne clique pas. Tu peux signaler le SMS en le transférant au 33700."},
 {c:"harcelement",t:"Bloquer et signaler",x:"Chaque réseau social a un bouton « Signaler » et un bouton « Bloquer ». Utilise-les sur le compte et sur chaque contenu. Les plateformes doivent retirer les contenus illégaux qu’on leur signale.",r:"Bloquer n’est pas fuir : c’est reprendre le contrôle de ton espace."},
 {c:"attaque",t:"Les mises à jour, ce n’est pas du luxe",x:"La plupart des attaques utilisent des failles déjà connues et déjà corrigées. Si tu ne mets pas à jour ton téléphone, ton ordinateur et tes applis, tu laisses la porte ouverte.",r:"Active les mises à jour automatiques partout où c’est possible."},
 {c:"harcelement",t:"Le 3018 est là pour toi",x:"Le 3018 est le numéro national contre le cyberharcèlement et les violences numériques. C’est gratuit, anonyme et confidentiel. On peut aussi les joindre par chat et par application. Ils aident à faire supprimer les contenus.",r:"Victime ou témoin, tu peux appeler le 3018."},
 {c:"attaque",t:"Les pièces jointes piégées et le rançongiciel",x:"Un fichier inattendu (facture, CV, « document à signer ») peut installer un rançongiciel, qui bloque tes fichiers et réclame de l’argent. Méfie-toi surtout des fichiers .exe, .zip ou des documents qui demandent d’« activer les macros ».",r:"N’ouvre pas une pièce jointe que tu n’attendais pas, même si l’expéditeur te semble connu."},
 {c:"harcelement",t:"Porter plainte",x:"Le cyberharcèlement est puni par la loi, avec des peines plus lourdes quand la victime est mineure. Tu peux déposer plainte au commissariat ou à la gendarmerie, avec tes captures d’écran. Les mineurs peuvent être accompagnés d’un parent ou d’un adulte de confiance.",r:"Même si ça semble long, déposer plainte permet d’agir contre l’auteur."},
 {c:"attaque",t:"La sauvegarde 3-2-1",x:"Pour ne jamais perdre tes photos et tes documents : 3 copies de tes fichiers, sur 2 supports différents (par exemple ton ordinateur et un disque dur externe), dont 1 copie hors site (dans un autre lieu ou dans un cloud).",r:"Une sauvegarde qu’on n’a jamais testée est une sauvegarde incertaine : vérifie-la de temps en temps."},
 {c:"harcelement",t:"Signaler sur PHAROS",x:"Pour un contenu illégal (menaces, injures racistes, appels à la haine, images violentes ou sexuelles), tu peux le signaler sur la plateforme officielle internet-signalement.gouv.fr, gérée par la police et la gendarmerie.",r:"Tu peux signaler même si tu n’es pas la victime directe."},
 {c:"attaque",t:"Le Wi-Fi public, prudence",x:"Sur un Wi-Fi ouvert (gare, café, centre commercial), d’autres personnes peuvent espionner ou t’envoyer vers de faux sites. Évite d’y entrer tes mots de passe ou d’y faire des achats.",r:"Pour les opérations sensibles, utilise ta 4G/5G ou un VPN de confiance."},
 {c:"harcelement",t:"Sextorsion : on ne paie pas",x:"Un inconnu te met en confiance, obtient des photos intimes puis menace de les diffuser si tu ne paies pas. Si ça t’arrive : ne paie pas, coupe le contact, garde les preuves, bloque et signale le compte. Tu es la victime, pas le coupable.",r:"Contacte le 3018 ou la police : ils ont l’habitude et ne te jugeront pas."},
 {c:"attaque",t:"Le faux conseiller bancaire",x:"Quelqu’un t’appelle en se disant de ta banque, dit que ton compte est piraté et te demande un code reçu par SMS ou de valider une opération. C’est de l’ingénierie sociale : il joue sur la peur et l’urgence pour te faire agir sans réfléchir.",r:"Ne donne jamais un code reçu par SMS. Raccroche et rappelle ta banque avec le numéro officiel."},
 {c:"harcelement",t:"Images intimes diffusées sans accord",x:"Partager une photo ou une vidéo intime d’une personne sans son accord est interdit et puni par la loi. Si c’est toi la victime, demande le retrait aux plateformes, garde les preuves et dépose plainte. Si on te l’envoie, ne la partage pas.",r:"Ne transfère jamais ces contenus : les partager fait de toi un complice."},
 {c:"attaque",t:"Les QR codes piégés",x:"Un QR code collé sur un parking, un menu ou un faux courrier peut mener vers un faux site de paiement ou de connexion. Un autocollant par-dessus un vrai code est une technique courante.",r:"Vérifie l’adresse affichée avant d’ouvrir le lien et ne saisis jamais tes données bancaires sur un site inconnu."},
 {c:"harcelement",t:"Sécuriser tes comptes",x:"Passe tes profils en privé, choisis qui peut te commenter ou t’écrire, et limite les infos visibles (école, adresse, photos). Moins l’agresseur a d’éléments sur toi, moins il peut en faire.",r:"Prends 10 minutes pour vérifier les paramètres de confidentialité de chaque réseau."},
 {c:"attaque",t:"Vérifier qu’un site est fiable",x:"Le petit cadenas ne prouve pas que le site est honnête : il indique seulement que la connexion est chiffrée. Regarde l’adresse en entier (une lettre changée, un .xyz bizarre), les mentions légales et les avis ailleurs que sur le site lui-même.",r:"Une offre trop belle pour être vraie est rarement vraie."},
 {c:"harcelement",t:"Témoin : ne reste pas spectateur",x:"Liker, partager ou rire d’un contenu humiliant, c’est participer au harcèlement. Tu peux à la place signaler le contenu, ne pas le relayer et écrire en privé à la personne ciblée pour lui dire que tu es de son côté.",r:"Un seul message de soutien peut changer la journée de quelqu’un."},
 {c:"attaque",t:"Piraté ? Les bons réflexes",x:"Si tu penses qu’un compte a été piraté : change vite le mot de passe, active la 2FA, déconnecte les autres appareils, prévient tes contacts et surveille tes comptes bancaires. Garde les preuves si tu veux porter plainte.",r:"Pour être guidé pas à pas, rends-toi sur cybermalveillance.gouv.fr."},
 {c:"synthese",t:"Doute, protège, signale, parle",x:"Face à une attaque ou à du harcèlement, les réflexes sont les mêmes : prendre le temps de douter, protéger ses comptes, signaler, et surtout en parler à quelqu’un. Tu n’es jamais obligé de gérer ça tout seul.",r:"Joyeux Noël ! Et si ça va très mal, le 3114 (prévention du suicide) répond jour et nuit."}
];

const grille = document.getElementById("grille");
const fenetre = document.getElementById("fenetre");
const toast = document.getElementById("toast");
const statut = document.getElementById("statut");
let MODE_TEST = new URLSearchParams(location.search).has("test");
const CLE = "avent-numerique-ouvertes";

let ouvertes = [];
try { ouvertes = JSON.parse(localStorage.getItem(CLE)) || []; } catch (e) { ouvertes = []; }
function sauver(){ try { localStorage.setItem(CLE, JSON.stringify(ouvertes)); } catch (e) {} }

function jourMax(){
  if (MODE_TEST) return 24;
  const d = new Date();
  return d.getMonth() === 11 ? Math.min(d.getDate(), 24) : 0;
}

function afficherStatut(){
  const max = jourMax(), d = new Date();
  if (MODE_TEST) statut.textContent = "Mode test : toutes les cases sont ouvertes";
  else if (max === 0) {
    const noel = new Date(d.getFullYear(), 11, 1);
    if (d > noel) noel.setFullYear(noel.getFullYear() + 1);
    const n = Math.ceil((noel - d) / 86400000);
    statut.textContent = "Première case dans " + n + (n > 1 ? " jours" : " jour") + " (1er décembre)";
  } else statut.textContent = "Aujourd’hui : case " + max + " disponible. " + ouvertes.length + "/24 lues";
}

function montrerToast(msg){
  toast.textContent = msg; toast.classList.add("visible");
  clearTimeout(montrerToast.t);
  montrerToast.t = setTimeout(() => toast.classList.remove("visible"), 2600);
}

function construire(){
  grille.innerHTML = "";
  const max = jourMax();
  DATA.forEach((item, i) => {
    const jour = i + 1;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "case";
    const verrou = jour > max;
    if (verrou) b.setAttribute("aria-disabled", "true");
    if (ouvertes.includes(jour)) b.classList.add("ouverte");
    b.setAttribute("aria-label", "Case " + jour + (verrou ? ", verrouillée" : ""));
    b.innerHTML = '<span class="num serif">' + jour + '</span><span class="mini">' +
      (verrou ? "Pas encore" : ouvertes.includes(jour) ? "Relire" : "Ouvrir") + "</span>";
    b.addEventListener("click", () => {
      if (verrou) {
        b.classList.remove("secoue"); void b.offsetWidth; b.classList.add("secoue");
        montrerToast("Reviens le " + jour + " décembre pour ouvrir cette case.");
        return;
      }
      ouvrir(jour);
    });
    grille.appendChild(b);
  });
  afficherStatut();
}

function ouvrir(jour){
  const it = DATA[jour - 1];
  document.getElementById("f-jour").textContent = jour + " décembre";
  const cat = document.getElementById("f-cat");
  cat.textContent = CATS[it.c].label;
  cat.className = "pastille " + it.c;
  document.getElementById("f-titre").textContent = it.t;
  document.getElementById("f-texte").textContent = it.x;
  const r = document.getElementById("f-retenir");
  r.innerHTML = "<b>À retenir :</b> ";
  r.appendChild(document.createTextNode(it.r));
  if (!ouvertes.includes(jour)) { ouvertes.push(jour); sauver(); }
  fenetre.showModal();
  fenetre.querySelector(".carte").scrollTop = 0;
}

function fermer(){
  fenetre.close();
  construire();
}
document.getElementById("fermer").addEventListener("click", fermer);
fenetre.addEventListener("click", e => { if (e.target === fenetre) fermer(); });
fenetre.addEventListener("cancel", e => { e.preventDefault(); fermer(); });

/* outils de test (supprime ce bloc avec le <div id="outils-test"> avant de rendre) */
(function(){
  const bTest = document.getElementById("btn-test"), bReset = document.getElementById("btn-reset");
  if (!bTest || !bReset) return;
  function maj(){
    bTest.setAttribute("aria-pressed", MODE_TEST);
    bTest.textContent = MODE_TEST ? "Désactiver le mode test" : "Activer le mode test";
  }
  bTest.addEventListener("click", () => { MODE_TEST = !MODE_TEST; maj(); construire(); });
  bReset.addEventListener("click", () => { ouvertes = []; sauver(); construire(); montrerToast("Toutes les cases sont refermées."); });
  maj();
})();

/* neige */
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const n = document.getElementById("neige");
  for (let i = 0; i < 40; i++) {
    const f = document.createElement("i"), s = 2 + Math.random() * 4;
    f.style.cssText = "left:" + Math.random() * 100 + "%;width:" + s + "px;height:" + s + "px;" +
      "--dx:" + (Math.random() * 80 - 40) + "px;animation-duration:" + (8 + Math.random() * 12) + "s;" +
      "animation-delay:-" + Math.random() * 20 + "s;opacity:" + (0.3 + Math.random() * 0.5);
    n.appendChild(f);
  }
})();

construire();
</script>
</body>
</html>
