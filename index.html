<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendrier de l'Avent - Culture & Sécurité Numérique</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-opened: #334155;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --locked-color: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      max-width: 700px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .controls {
      margin-bottom: 1.5rem;
    }

    .toggle-btn {
      background-color: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .toggle-btn:hover {
      background-color: var(--accent);
      color: var(--bg-color);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 1100px;
    }

    .door {
      perspective: 1000px;
      height: 160px;
    }

    .door-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .door.opened .door-inner {
      transform: rotateY(180deg);
    }

    .door-front, .door-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .door-front {
      background-color: var(--card-bg);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .door-front:hover {
      border-color: var(--accent);
    }

    .door-front .day-number {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
    }

    .door-front .tag {
      font-size: 0.75rem;
      margin-top: 0.5rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .door-back {
      background-color: var(--card-opened);
      transform: rotateY(180deg);
      justify-content: space-between;
      text-align: left;
    }

    .door-back .category {
      font-size: 0.7rem;
      font-weight: bold;
      color: var(--accent);
      text-transform: uppercase;
    }

    .door-back .content {
      font-size: 0.82rem;
      line-height: 1.3;
      color: var(--text-main);
      margin: auto 0;
    }

    .door.locked .door-front {
      background-color: #111827;
      opacity: 0.6;
      cursor: not-allowed;
    }

    .door.locked .door-front .day-number {
      color: var(--locked-color);
    }

    footer {
      margin-top: 3rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Calendrier de l'Avent Numérique</h1>
    <p>Chaque jour de décembre, découvrez un conseil pratique sur la cybersécurité, le cyberharcèlement, la vie privée ou l'éco-responsabilité.</p>
  </header>

  <div class="controls">
    <button class="toggle-btn" id="devToggle">Mode Test (Toutes les cases ouvertes)</button>
  </div>

  <div class="calendar-grid" id="calendar"></div>

  <footer>
    <p>Projet Open Source — Hébergé sur GitHub Pages</p>
  </footer>

  <script>
    const adventData = [
      { day: 1, category: "Cybersécurité", text: "Utilisez un gestionnaire de mots de passe pour générer et stocker des identifiants uniques." },
      { day: 2, category: "Cyberharcèlement", text: "Reconnaissez les signes du cyberharcèlement : ne restez pas seul et parlez-en à un proche." },
      { day: 3, category: "Vie privée", text: "Activez la double authentification (2FA) sur tous vos comptes sensibles." },
      { day: 4, category: "Sobriété", text: "Triez vos emails et désabonnez-vous des newsletters inutiles pour alléger les serveurs." },
      { day: 5, category: "Culture web", text: "Vérifiez toujours une information (fact-checking) et la source avant de la partager." },
      { day: 6, category: "Cybersécurité", text: "Apprenez à repérer le phishing : vérifiez l'adresse réelle de l'expéditeur." },
      { day: 7, category: "Cyberharcèlement", text: "Effectuez des captures d'écran horodatées pour conserver des preuves en cas d'attaque." },
      { day: 8, category: "Vie privée", text: "Vérifiez régulièrement les paramètres de confidentialité de vos réseaux sociaux." },
      { day: 9, category: "Éco-responsabilité", text: "Éteignez complètement vos appareils la nuit au lieu de les laisser en veille." },
      { day: 10, category: "Culture web", text: "Restez vigilant face aux fausses images générées par IA : observez les détails et les textures." },
      { day: 11, category: "Cybersécurité", text: "Appliquez la règle 3-2-1 pour vos sauvegardes : 3 copies, 2 supports différents, 1 hors ligne." },
      { day: 12, category: "Cyberharcèlement", text: "N'hésitez pas à bloquer et signaler immédiatement les comptes malveillants." },
      { day: 13, category: "Vie privée", text: "Limitez les autorisations (micro, caméra, position) accordées aux applications." },
      { day: 14, category: "Sobriété", text: "Baissez la résolution de streaming quand une haute définition n'est pas nécessaire." },
      { day: 15, category: "Culture web", text: "Attention aux dark patterns : les pièges visuels conçus pour vous faire consommer." },
      { day: 16, category: "Cybersécurité", text: "Maintenez vos systèmes et applications à jour pour corriger les failles de sécurité." },
      { day: 17, category: "Cyberharcèlement", text: "En France, contactez le 3018 pour obtenir une aide gratuite et anonyme." },
      { day: 18, category: "Vie privée", text: "Évitez les transactions sensibles sur les réseaux Wi-Fi publics sans VPN." },
      { day: 19, category: "Éco-responsabilité", text: "Donnez une seconde vie à votre matériel obsolète (reconditionnement ou recyclage)." },
      { day: 20, category: "Culture web", text: "Accordez-vous des pauses sans écran pour maintenir un bon bien-être numérique." },
      { day: 21, category: "Cybersécurité", text: "Changez le mot de passe par défaut de votre box Wi-Fi domestique." },
      { day: 22, category: "Cyberharcèlement", text: "Adoptez une posture d'allié : soutenez publiquement les personnes ciblées." },
      { day: 23, category: "Vie privée", text: "Effacez régulièrement les cookies et l'historique de votre navigateur." },
      { day: 24, category: "Synthèse", text: "Adoptez au quotidien une hygiène numérique sereine, responsable et éclairée !" }
    ];

    let enforceDateCheck = false; // Mis à false par défaut pour voir toutes les cases tout de suite
    const calendarContainer = document.getElementById('calendar');
    const devToggleBtn = document.getElementById('devToggle');

    function renderCalendar() {
      calendarContainer.innerHTML = '';
      const today = new Date();
      const currentMonth = today.getMonth(); 
      const currentDay = today.getDate();

      adventData.forEach(item => {
        const door = document.createElement('div');
        door.classList.add('door');

        const isLocked = enforceDateCheck && (currentMonth < 11 || (currentMonth === 11 && item.day > currentDay));

        if (isLocked) {
          door.classList.add('locked');
        }

        door.innerHTML = `
          <div class="door-inner">
            <div class="door-front">
              <span class="day-number">${item.day}</span>
              <span class="tag">Jour</span>
            </div>
            <div class="door-back">
              <span class="category">${item.category}</span>
              <p class="content">${item.text}</p>
            </div>
          </div>
        `;

        door.addEventListener('click', () => {
          if (!door.classList.contains('locked')) {
            door.classList.toggle('opened');
          }
        });

        calendarContainer.appendChild(door);
      });
    }

    devToggleBtn.addEventListener('click', () => {
      enforceDateCheck = !enforceDateCheck;
      devToggleBtn.textContent = enforceDateCheck 
        ? "Mode Réel (Cases verrouillées selon la date)" 
        : "Mode Test (Toutes les cases ouvertes)";
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
